name: tests
on:
  push: { branches: [main] }
  pull_request:
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # MongoDB single-node replica set (transactions require a replica set)
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "8.0"
          mongodb-replica-set-name: rs0
          mongodb-port: 27017

      - run: cd server && npm ci
      - run: cd server && npm test
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/nexora-pos-test?replicaSet=rs0&directConnection=true
          JWT_SECRET: ci-secret
