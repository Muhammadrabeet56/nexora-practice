name: tests
on:
  push: { branches: [main] }
  pull_request:
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd server && npm ci
      - run: cd server && npm test
        env: { MONGO_URL: "mongodb://localhost:27017/nexora-pos-test" }
